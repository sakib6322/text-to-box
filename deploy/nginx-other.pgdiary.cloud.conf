# /etc/nginx/sites-available/other.pgdiary.cloud
# Second site on subdomain — static files in /var/www/other
# Optional API on :8788 (uncomment location /api/ if needed)
# After DNS A record points here, run: certbot --nginx -d other.pgdiary.cloud

server {
    listen 80;
    server_name other.pgdiary.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # location /api/ {
    #     proxy_pass http://127.0.0.1:8788;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    root /var/www/other;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
